name: API Negotiation Collaboration Neon Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/api/src/negotiation/**'
      - 'packages/database/**'
      - '.github/workflows/api-negotiation-collaboration-neon-gate.yml'

permissions:
  contents: read

concurrency:
  group: api-negotiation-collaboration-neon-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NEON_PROJECT_ID: raspy-river-76339604
  DATABASE_NAME: nexora

jobs:
  negotiation-collaboration-api:
    name: Negotiation collaboration API against nexora_app
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Neon API secret
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}" || { echo "NEON_API_KEY repository secret is not configured." >&2; exit 1; }

      - name: Set ephemeral branch
        shell: bash
        run: |
          set -euo pipefail
          echo "NEON_TEST_BRANCH=pr-${{ github.event.pull_request.number }}-neg-api-${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "NEON_TEST_EXPIRES_AT=$(date -u --date '+2 hours' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create isolated Neon branch
        id: admin
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: staging
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: ${{ env.DATABASE_NAME }}
          role: neondb_owner
          expires_at: ${{ env.NEON_TEST_EXPIRES_AT }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Bootstrap migration capability
        env:
          ADMIN_DATABASE_URL: ${{ steps.admin.outputs.db_url }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$ADMIN_DATABASE_URL"
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT CREATE ON DATABASE nexora TO nexora_owner;
          GRANT USAGE, CREATE ON SCHEMA public TO nexora_owner;
          SQL

      - name: Resolve migrator connection
        id: migrator
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: staging
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: ${{ env.DATABASE_NAME }}
          role: nexora_migrator
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Apply migrations and seed collaboration fixtures
        env:
          MIGRATOR_DATABASE_URL: ${{ steps.migrator.outputs.db_url }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$MIGRATOR_DATABASE_URL"
          if [[ "$MIGRATOR_DATABASE_URL" == *"?"* ]]; then
            OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}&options=-c%20role%3Dnexora_owner"
          else
            OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}?options=-c%20role%3Dnexora_owner"
          fi
          echo "::add-mask::$OWNER_DATABASE_URL"
          roles="$(psql "$OWNER_DATABASE_URL" -Atqc "select session_user || ':' || current_user")"
          [[ "$roles" == "nexora_migrator:nexora_owner" ]] || { echo "Unexpected migration role chain: $roles" >&2; exit 1; }
          DATABASE_URL="$OWNER_DATABASE_URL" pnpm --filter @nexora/database db:migrate

          expected="$(find packages/database/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          ledger="$(psql "$OWNER_DATABASE_URL" -Atqc "select count(*) from drizzle.__drizzle_migrations")"
          last_id="$(psql "$OWNER_DATABASE_URL" -Atqc "select coalesce(max(id),0) from drizzle.__drizzle_migrations")"
          echo "Migration ledger measurement: files=$expected rows=$ledger last_id=$last_id"
          [[ "$expected" == "49" ]] || { echo "Expected exactly 49 SQL migrations, found $expected" >&2; exit 1; }
          [[ "$ledger" == "49" ]] || { echo "Migration ledger is not 49/49: files=$expected rows=$ledger" >&2; exit 1; }
          [[ "$last_id" == "49" ]] || { echo "Migration ledger last_id is not 49: $last_id" >&2; exit 1; }

          before="$(psql "$OWNER_DATABASE_URL" -Atqc "select count(*) from drizzle.__drizzle_migrations")"
          DATABASE_URL="$OWNER_DATABASE_URL" pnpm --filter @nexora/database db:migrate
          after="$(psql "$OWNER_DATABASE_URL" -Atqc "select count(*) from drizzle.__drizzle_migrations")"
          echo "Migration idempotency measurement: before=$before after=$after"
          [[ "$before" == "$after" ]] || { echo "Migration rerun changed ledger: before=$before after=$after" >&2; exit 1; }
          [[ "$after" == "49" ]] || { echo "Migration ledger after idempotency rerun is not 49: $after" >&2; exit 1; }

          psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO tenants(id,slug,name,status) VALUES
            ('11111111-1111-4111-8111-111111111111','neg-api-a','Negotiation API A','active'),
            ('22222222-2222-4222-8222-222222222222','neg-api-b','Negotiation API B','active');

          INSERT INTO users(id,display_name,status) VALUES
            ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','Negotiation API User A','active'),
            ('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb','Negotiation API User B','active');

          INSERT INTO memberships(id,tenant_id,user_id,status,joined_at) VALUES
            ('aaaaaaaa-1111-4111-8111-aaaaaaaaaaaa','11111111-1111-4111-8111-111111111111','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','active',now()),
            ('bbbbbbbb-2222-4222-8222-bbbbbbbbbbbb','22222222-2222-4222-8222-222222222222','bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb','active',now());

          INSERT INTO business_parties(id,tenant_id,tax_id,legal_name,status) VALUES
            ('a1000000-0000-4000-8000-000000000001','11111111-1111-4111-8111-111111111111','A100','Customer A','active'),
            ('a1000000-0000-4000-8000-000000000002','11111111-1111-4111-8111-111111111111','A200','Shipper A','active'),
            ('a1000000-0000-4000-8000-000000000003','11111111-1111-4111-8111-111111111111','A300','Consignee A','active');

          INSERT INTO business_party_addresses(id,tenant_id,party_id,type,label,street,city,state,country_code) VALUES
            ('a1100000-0000-4000-8000-000000000001','11111111-1111-4111-8111-111111111111','a1000000-0000-4000-8000-000000000002','pickup','Origin A','Rua A','Sao Paulo','SP','BR'),
            ('a1100000-0000-4000-8000-000000000002','11111111-1111-4111-8111-111111111111','a1000000-0000-4000-8000-000000000003','delivery','Destination A','Rua B','Campinas','SP','BR');

          INSERT INTO transport_requests(
            id,tenant_id,customer_party_id,shipper_party_id,consignee_party_id,origin_address_id,destination_address_id,
            planned_pickup_at,planned_delivery_at,cargo_description,status,created_by_user_id,updated_by_user_id
          ) VALUES (
            'a1200000-0000-4000-8000-000000000001','11111111-1111-4111-8111-111111111111',
            'a1000000-0000-4000-8000-000000000001','a1000000-0000-4000-8000-000000000002','a1000000-0000-4000-8000-000000000003',
            'a1100000-0000-4000-8000-000000000001','a1100000-0000-4000-8000-000000000002',
            now(),now()+interval '1 day','Negotiation API cargo','in_negotiation',
            'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'
          );
          SQL

      - name: Resolve nexora_app connection
        id: app
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: staging
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: ${{ env.DATABASE_NAME }}
          role: nexora_app
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Build API
        run: pnpm --filter @nexora/api build

      - name: Run negotiation collaboration integration
        shell: bash
        env:
          DATABASE_URL: ${{ steps.app.outputs.db_url }}
          DATABASE_POOL_MAX: '2'
        run: |
          set -euo pipefail
          echo "::add-mask::$DATABASE_URL"
          node apps/api/dist/negotiation/negotiation-collaboration.integration.js

      - name: Gate summary
        shell: bash
        run: |
          {
            echo '## Wave 0021 API Negotiation Collaboration Gate'
            echo '- Thread creation and creator membership: verified'
            echo '- Internal/external participant lifecycle: verified'
            echo '- Message and reply persistence through nexora_app: verified'
            echo '- Cross-tenant thread visibility: rejected by RLS'
            echo '- Closed-thread mutations: rejected by service rules'
            echo '- Migration ledger: 49 SQL files = 49 ledger rows'
            echo '- Migration idempotency: second db:migrate kept ledger at 49 rows'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete isolated Neon branch
        if: ${{ always() && steps.admin.outputs.branch_id != '' }}
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: ${{ env.NEON_TEST_BRANCH }}
          api_key: ${{ secrets.NEON_API_KEY }}
